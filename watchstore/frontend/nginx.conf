server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gọi API cùng origin với trang web, giống proxy của Vite lúc dev,
    # nên cookie refresh_token (Path=/api/auth) được gửi kèm bình thường
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File build có hash trong tên nên cache lâu được
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: mọi route không phải file tĩnh trả về index.html cho React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
