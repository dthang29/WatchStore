spring.application.name=watchstore
server.port=8080

# Đọc biến môi trường từ file .env (không commit). Hỗ trợ chạy từ thư mục backend/ hoặc watchstore/
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# ===== Database =====
# Mặc định trỏ tới MySQL trong Docker (cổng 3307 để không đụng MySQL80 cài sẵn trên máy)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/watch_shop?serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:watchstore}
spring.datasource.password=${DB_PASSWORD:}

# Schema do Flyway quản lý, Hibernate chỉ kiểm tra khớp
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# DB watch_shop đã tạo sẵn bằng watch_shop.sql (chưa có bảng flyway_schema_history):
# đánh dấu nó là V1 rồi chỉ chạy các migration từ V2 trở đi
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.mvc.problemdetails.enabled=true
spring.data.web.pageable.max-page-size=100

# ===== Security / JWT =====
# Secret Base64, tối thiểu 256 bit. Tạo mới: openssl rand -base64 48
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.issuer=watchstore
app.security.jwt.access-token-ttl=15m
app.security.jwt.refresh-token-ttl=7d
# Bật true khi chạy HTTPS (production)
app.security.cookie.secure=${COOKIE_SECURE:false}
app.security.cookie.same-site=Lax
app.security.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.security.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# Tài khoản admin được tạo lúc khởi động nếu chưa tồn tại (để trống để bỏ qua)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ===== OAuth2 Google =====
# Bỏ comment khi đã có client trên Google Cloud Console.
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# ===== VNPay =====
app.vnpay.tmn-code=${VNPAY_TMN_CODE:}
app.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/vnpay/return}
app.vnpay.confirm-on-return=${VNPAY_CONFIRM_ON_RETURN:false}

# ===== Email / SMTP =====
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.from=${MAIL_FROM:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties[mail.smtp.auth]=${MAIL_SMTP_AUTH:true}
spring.mail.properties[mail.smtp.starttls.enable]=${MAIL_STARTTLS:true}
spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000
